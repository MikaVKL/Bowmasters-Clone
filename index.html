<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bowmasters Clone</title>
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1a1a2e;
    font-family: "Segoe UI", Arial, sans-serif;
    user-select: none;
  }

  #game-canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
    cursor: crosshair;
  }

  #ui-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }

  /* Gemeinsamer "Panel"-Look für HUD, Zuganzeige & Distanzanzeige */
  .panel {
    background: rgba(15, 15, 25, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
  }

  .hud {
    position: absolute;
    top: 20px;
    width: 220px;
    padding: 10px 14px;
    color: #fff;
    transition: transform 0.2s ease;
  }

  #hud-p1 {
    left: 20px;
    border-left: 3px solid #64b5f6;
  }

  #hud-p2 {
    right: 20px;
    text-align: right;
    border-right: 3px solid #ef5350;
  }

  .hud.active {
    transform: scale(1.03);
    box-shadow: 0 6px 20px rgba(255, 213, 79, 0.25), 0 4px 16px rgba(0, 0, 0, 0.35);
  }

  .name {
    font-weight: bold;
    font-size: 13px;
    letter-spacing: 0.3px;
    margin-bottom: 6px;
    text-transform: uppercase;
    opacity: 0.85;
  }

  .healthbar {
    width: 100%;
    height: 16px;
    background: rgba(0, 0, 0, 0.5);
    border-radius: 8px;
    overflow: hidden;
    border: 2px solid rgba(0, 0, 0, 0.6);
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
  }

  .healthbar-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(180deg, #81c784, #4caf50 55%, #388e3c);
    transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .healthbar-fill.low {
    background: linear-gradient(180deg, #ff8a65, #e53935 55%, #b71c1c);
    animation: pulse-low 1s ease-in-out infinite;
  }

  @keyframes pulse-low {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.35); }
  }

  #turn-indicator {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 9px 22px;
    color: #ffd54f;
    font-weight: bold;
    letter-spacing: 0.3px;
    transition: color 0.2s ease;
  }

  #distance-indicator {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    padding: 10px 10px;
    color: #cfd8dc;
    font-size: 14px;
    font-weight: bold;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    transition: left 0.3s ease, right 0.3s ease;
  }

  #distance-indicator.side-left {
    left: 14px;
  }

  #distance-indicator.side-right {
    right: 14px;
  }

  #distance-indicator .arrow {
    font-size: 20px;
    color: #ffd54f;
    animation: arrow-nudge 1.4s ease-in-out infinite;
  }

  #distance-indicator.side-right .arrow {
    animation-name: arrow-nudge-right;
  }

  @keyframes arrow-nudge {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(-3px); }
  }

  @keyframes arrow-nudge-right {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(3px); }
  }

  #aim-hint {
    position: absolute;
    bottom: 36px;
    left: 50%;
    transform: translateX(-50%);
    padding: 8px 18px;
    color: #e0e0e0;
    font-size: 13px;
    opacity: 1;
    transition: opacity 0.6s ease;
  }

  #aim-hint.hidden {
    opacity: 0;
  }

  /* In der linken unteren Ecke, damit der Daumen den Charakter/die
     Zielfläche in der Bildschirmmitte nicht mehr überdeckt. */
  #move-controls {
    position: absolute;
    bottom: 26px;
    left: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    pointer-events: all;
    transition: opacity 0.25s ease;
  }

  #move-controls.hidden {
    display: none;
  }

  #move-status {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    min-width: 150px;
    color: #fff;
    font-size: 12px;
  }

  #move-staminabar {
    width: 130px;
    height: 8px;
    background: rgba(0, 0, 0, 0.5);
    border-radius: 4px;
    overflow: hidden;
  }

  #move-staminabar-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #64b5f6, #4fc3f7);
    transition: width 0.08s linear;
  }

  /* Joystick: Basis-Ring + Knopf, den man horizontal zieht. Die
     Auslenkung bestimmt sowohl Richtung als auch Lauftempo. */
  #joystick-base {
    position: relative;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: rgba(15, 15, 25, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4), inset 0 0 0 1px rgba(255, 255, 255, 0.04);
    touch-action: none;
    cursor: grab;
  }

  #joystick-knob {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    margin: -22px 0 0 -22px;
    border-radius: 50%;
    background: rgba(255, 213, 79, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.4);
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.4);
    pointer-events: none;
    transition: background 0.15s ease;
  }

  #joystick-base.active #joystick-knob {
    background: rgba(255, 213, 79, 1);
  }

  #winner-screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    background: rgba(0, 0, 0, 0.7);
    pointer-events: all;
    animation: fade-in 0.3s ease;
  }

  #winner-screen.hidden {
    display: none;
  }

  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes pop-in {
    from { opacity: 0; transform: scale(0.8) translateY(10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  #winner-trophy {
    font-size: 56px;
    animation: pop-in 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  #winner-text {
    font-size: 42px;
    color: #ffd54f;
    font-weight: bold;
    text-shadow: 2px 2px 6px #000;
    animation: pop-in 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  #restart-btn {
    padding: 13px 30px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    background: #ffd54f;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 4px 12px rgba(255, 213, 79, 0.3);
    transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
  }

  #restart-btn:hover {
    background: #ffca28;
    box-shadow: 0 6px 16px rgba(255, 213, 79, 0.4);
    transform: translateY(-1px);
  }

  #restart-btn:active {
    transform: translateY(1px) scale(0.98);
    box-shadow: 0 2px 6px rgba(255, 213, 79, 0.3);
  }

  /* Auf schmalen Bildschirmen (Handy) waren HUD und Zuganzeige groß
     genug, um sich gegenseitig zu überlappen - hier verkleinert und
     die Zuganzeige unter die HUDs verschoben, damit nichts kollidiert. */
  @media (max-width: 700px) {
    .hud {
      width: 130px;
      padding: 7px 10px;
    }

    .name {
      font-size: 11px;
      margin-bottom: 3px;
    }

    .healthbar {
      height: 11px;
    }

    #turn-indicator {
      top: 76px;
      font-size: 13px;
      padding: 6px 16px;
    }

    #distance-indicator {
      font-size: 12px;
      padding: 8px 6px;
    }

    /* Unten links sitzt jetzt der Joystick - der Hinweistext würde
       dort hineinragen, deshalb auf schmalen Screens stattdessen
       oben unter der Zuganzeige einblenden. */
    #aim-hint {
      bottom: auto;
      top: 118px;
      font-size: 12px;
    }
  }
</style>
</head>
<body>
  <div id="ui-overlay">
    <div class="hud panel" id="hud-p1">
      <div class="name" id="name-p1">Spieler 1</div>
      <div class="healthbar"><div class="healthbar-fill" id="hp-p1"></div></div>
    </div>
    <div class="hud panel" id="hud-p2">
      <div class="name" id="name-p2">Spieler 2</div>
      <div class="healthbar"><div class="healthbar-fill" id="hp-p2"></div></div>
    </div>
    <div id="turn-indicator" class="panel">Spieler 1 ist am Zug</div>
    <div id="distance-indicator" class="panel"><span class="arrow">→</span><span class="value">0m</span></div>
    <div id="aim-hint" class="panel">Zum Zielen ziehen &amp; loslassen</div>
    <div id="move-controls" class="hidden">
      <div id="move-status" class="panel">
        <span id="move-label">Ausdauer</span>
        <div id="move-staminabar"><div id="move-staminabar-fill"></div></div>
      </div>
      <div id="joystick-base">
        <div id="joystick-knob"></div>
      </div>
    </div>
    <div id="winner-screen" class="hidden">
      <div id="winner-trophy">🏆</div>
      <div id="winner-text"></div>
      <button id="restart-btn">Nochmal spielen</button>
    </div>
  </div>
  <canvas id="game-canvas"></canvas>

<script>
// ---------------------------------------------------------------------
// Charakter-Definitionen. Neue Charaktere kommen einfach als weiterer
// Eintrag hier rein - Farbe, Basiswerte, Fähigkeit. Die Spiellogik
// darunter muss dafür nicht angefasst werden.
// ---------------------------------------------------------------------
const Characters = {
  main: {
    id: "main",
    name: "Bowman",
    color: "#8d6e63",
    bowColor: "#5d4037",
    maxHealth: 100,
    ability: {
      id: "power_shot",
      name: "Power Shot",
      description: "Ein normaler, kräftiger Pfeil.",
      damage: 20, // Körpertreffer
      headshotDamage: 40, // Kopftreffer - doppelter Schaden
      projectileColor: "#f5f5f5",
      speedMultiplier: 1,
    },
  },
};

function getCharacter(id) {
  return Characters[id] ?? Characters.main;
}

// ---------------------------------------------------------------------
// Trefferzonen (relativ zur Spielerposition) - von Zeichnen und
// Kollisionserkennung gemeinsam genutzt, damit Hitbox und Grafik
// immer übereinstimmen.
// ---------------------------------------------------------------------
const HEAD_OFFSET_Y = -68;
const HEAD_RADIUS = 20;
const BODY_OFFSET_Y = -30;
const BODY_RADIUS = 34;

// ---------------------------------------------------------------------
// Spieler
// ---------------------------------------------------------------------
class Player {
  constructor({ id, characterId, x, y, facing }) {
    this.id = id;
    this.character = getCharacter(characterId);
    this.x = x;
    this.y = y;
    this.facing = facing; // 1 = schaut nach rechts, -1 = nach links
    this.health = this.character.maxHealth;
    this.aimAngle = facing === 1 ? -0.3 : Math.PI + 0.3;
  }

  get isAlive() {
    return this.health > 0;
  }

  takeDamage(amount) {
    this.health = Math.max(0, this.health - amount);
  }

  draw(ctx) {
    const { x, y } = this;
    const flip = this.facing;

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(flip, 1);

    // Beine
    ctx.strokeStyle = "#3e2723";
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(-10, 0);
    ctx.lineTo(-14, 40);
    ctx.moveTo(10, 0);
    ctx.lineTo(14, 40);
    ctx.stroke();

    // Körper
    ctx.fillStyle = this.character.color;
    ctx.beginPath();
    ctx.ellipse(0, BODY_OFFSET_Y, 22, 32, 0, 0, Math.PI * 2);
    ctx.fill();

    // Kopf
    ctx.fillStyle = "#ffccbc";
    ctx.beginPath();
    ctx.arc(0, HEAD_OFFSET_Y, 16, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    // Bogen & Ziellinie: bewusst außerhalb des Flip-Transforms und
    // direkt anhand von aimAngle gezeichnet, damit der Bogen sich
    // wirklich mit der Zugrichtung mitdreht statt in einem starren
    // 90°-Winkel "eingefroren" zu sein.
    if (this.isAlive) {
      const handX = x;
      const handY = y - 35;

      ctx.save();
      ctx.translate(handX, handY);
      ctx.rotate(this.aimAngle);
      ctx.strokeStyle = this.character.bowColor;
      ctx.lineWidth = 4;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.arc(0, 0, 22, -1.15, 1.15);
      ctx.stroke();
      // Sehne
      ctx.strokeStyle = "rgba(230,220,200,0.8)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(Math.cos(-1.15) * 22, Math.sin(-1.15) * 22);
      ctx.lineTo(Math.cos(1.15) * 22, Math.sin(1.15) * 22);
      ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.strokeStyle = "rgba(255,255,255,0.5)";
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(handX, handY);
      ctx.lineTo(
        handX + Math.cos(this.aimAngle) * 60,
        handY + Math.sin(this.aimAngle) * 60
      );
      ctx.stroke();
      ctx.restore();
    }
  }
}

// ---------------------------------------------------------------------
// Projektil
// ---------------------------------------------------------------------
const GRAVITY = 1050; // px/s^2 - hoch genug für einen deutlich sichtbaren Bogen

class Projectile {
  constructor({ x, y, vx, vy, damage, color, ownerId }) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.damage = damage;
    this.color = color;
    this.ownerId = ownerId;
    this.dead = false;
    this.trail = [];
  }

  update(dt) {
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > 12) this.trail.shift();

    this.vy += GRAVITY * dt;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
  }

  get angle() {
    return Math.atan2(this.vy, this.vx);
  }

  draw(ctx) {
    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,0.25)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    this.trail.forEach((p, i) => {
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    });
    ctx.stroke();

    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.moveTo(14, 0);
    ctx.lineTo(-10, -4);
    ctx.lineTo(-10, 4);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

// ---------------------------------------------------------------------
// Spiel
// ---------------------------------------------------------------------
const canvas = document.getElementById("game-canvas");
const ctx = canvas.getContext("2d");

const hpFillP1 = document.getElementById("hp-p1");
const hpFillP2 = document.getElementById("hp-p2");
const hudP1 = document.getElementById("hud-p1");
const hudP2 = document.getElementById("hud-p2");
const turnIndicator = document.getElementById("turn-indicator");
const distanceIndicator = document.getElementById("distance-indicator");
const aimHint = document.getElementById("aim-hint");
const moveControls = document.getElementById("move-controls");
const joystickBase = document.getElementById("joystick-base");
const joystickKnob = document.getElementById("joystick-knob");
const staminaFill = document.getElementById("move-staminabar-fill");
const winnerScreen = document.getElementById("winner-screen");
const winnerText = document.getElementById("winner-text");
const restartBtn = document.getElementById("restart-btn");

const MAX_DRAG = 210;
const POWER_TO_SPEED = 10;

// Bewegung: der Joystick ist die ganze Runde über nutzbar, blockiert
// nie das Zielen/Schießen. Eine Ausdauer-Leiste (kein Timer) begrenzt
// die Gesamtstrecke pro Zug auf ca. 20m - sie läuft nur beim
// tatsächlichen Laufen leer, dann bleibt man einfach stehen.
const STAMINA_RANGE = 200; // Welteinheiten Laufbudget pro Zug (~20m, 10 Einheiten = 1m)
const MOVE_SPEED = 90; // Welteinheiten/Sekunde
const MOVE_MIN_GAP = 300; // Mindestabstand zum Gegner beim Umherlaufen

// Die Arena ist viel breiter als der Bildschirm: die Spieler stehen an
// zufälligen, unterschiedlich weit auseinander liegenden Positionen,
// damit man nicht jedes Mal denselben Winkel/dieselbe Kraft schießen
// kann. groundY bleibt bildschirmbezogen (Boden ist immer unten).
// Größerer Abstand = schwerer zu treffen, man braucht mehr Kraft.
// Statt einer künstlichen Winkel-Sperre sorgen Hügel im Gelände
// dafür, dass ein rein waagerechter Schuss oft gar nicht erst bis
// zum Gegner kommt - man zielt frei, muss aber manchmal drüber
// lupfen.
const WORLD_MARGIN = 500;
const MIN_DISTANCE = 1800;
const MAX_DISTANCE = 3400;
const WORLD_WIDTH = MAX_DISTANCE + WORLD_MARGIN * 2;

// Zoomstufe während des Pfeilflugs - deutlich herausgezoomt, um das
// Gelände zu überblicken (< 1 = mehr Weltraum sichtbar als 1:1).
const FLIGHT_ZOOM = 0.55;

let width, height, groundY;

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  groundY = height - 90;
  if (game) game.layout();
}
window.addEventListener("resize", resize);

class Game {
  constructor() {
    this.reset();
  }

  reset() {
    this.players = [
      new Player({ id: "p1", characterId: "main", x: 0, y: 0, facing: 1 }),
      new Player({ id: "p2", characterId: "main", x: 0, y: 0, facing: -1 }),
    ];
    this.turn = 0; // Index in players
    this.projectiles = [];
    this.hitTexts = [];
    this.isDragging = false;
    this.dragStart = null;
    this.dragCurrent = null;
    this.gameOver = false;
    this.shake = 0;
    this.hasFiredOnce = false;
    winnerScreen.classList.add("hidden");
    aimHint.classList.remove("hidden");
    this.updateHud();
    this.randomizeArena();
    this.showMovementControls();
  }

  // Neue Runde: zufälliger Abstand zwischen den Spielern, an
  // zufälliger Stelle in der (viel breiteren) Arena platziert, plus
  // neues Gelände (Hügel zwischen den Spielern, Bäume überall).
  randomizeArena() {
    if (!width) return;
    const distance = MIN_DISTANCE + Math.random() * (MAX_DISTANCE - MIN_DISTANCE);
    const usableWidth = WORLD_WIDTH - WORLD_MARGIN * 2 - distance;
    const p1X = WORLD_MARGIN + Math.random() * Math.max(0, usableWidth);

    this.players[0].x = p1X;
    this.players[1].x = p1X + distance;
    this.distance = distance;
    this.hills = this.generateHills(p1X, p1X + distance);
    this.trees = this.generateTrees();
    this.updateDistanceUI();
    this.layout();
  }

  // Hügel liegen (überwiegend) zwischen den beiden Spielern und
  // wirken als echtes Hindernis: ein flacher Schuss kracht in den
  // Hang statt beim Gegner anzukommen - man muss drüber zielen,
  // nicht weil eine Regel es verlangt, sondern weil der Weg sonst
  // blockiert ist.
  generateHills(p1X, p2X) {
    const gapStart = Math.min(p1X, p2X) + 200;
    const gapEnd = Math.max(p1X, p2X) - 200;
    const hills = [];
    if (gapEnd > gapStart) {
      const count = 1 + Math.floor(Math.random() * 2); // 1-2 Hügel
      for (let i = 0; i < count; i++) {
        hills.push({
          centerX: gapStart + Math.random() * (gapEnd - gapStart),
          // breiter + flacherer Exponent (in terrainHeightAt) = deutlich
          // sanftere Hänge statt steiler Buckel.
          width: 420 + Math.random() * 420,
          height: 70 + Math.random() * 130,
        });
      }
    }

    // Feine, zufällige Unebenheit obendrauf (zwei überlagerte
    // Sinuswellen), damit das Gelände nicht wie eine perfekte
    // Glockenkurve wirkt, sondern etwas organischer.
    this.terrainNoise = {
      freq1: 0.0022 + Math.random() * 0.0018,
      phase1: Math.random() * Math.PI * 2,
      amp1: 6 + Math.random() * 6,
      freq2: 0.006 + Math.random() * 0.004,
      phase2: Math.random() * Math.PI * 2,
      amp2: 3 + Math.random() * 3,
    };

    return hills;
  }

  // Höhe der Geländeoberfläche (Welt-Y) an einer bestimmten Welt-X-
  // Position - Summe sanfter Hügel über der Basislinie, plus etwas
  // leichtes Rauschen für eine organischere, weniger "computergenaue"
  // Silhouette.
  terrainHeightAt(x) {
    let bump = 0;
    for (const h of this.hills) {
      const t = (x - h.centerX) / h.width;
      bump += h.height * Math.exp(-t * t * 1.8);
    }

    const n = this.terrainNoise;
    if (n) {
      bump +=
        Math.sin(x * n.freq1 + n.phase1) * n.amp1 +
        Math.sin(x * n.freq2 + n.phase2) * n.amp2;
    }

    return groundY - bump;
  }

  generateTrees() {
    const trees = [];
    const count = 18 + Math.floor(Math.random() * 10);
    for (let i = 0; i < count; i++) {
      trees.push({
        x: WORLD_MARGIN * 0.3 + Math.random() * (WORLD_WIDTH - WORLD_MARGIN * 0.6),
        scale: 0.65 + Math.random() * 0.75,
        tone: Math.random(),
      });
    }
    return trees;
  }

  // Wird auch bei Fenstergröße-Änderungen aufgerufen - verändert nur
  // bildschirmabhängige Werte, nie die Arena-Zufallswerte selbst.
  layout() {
    if (!width) return;
    this.players[0].y = this.terrainHeightAt(this.players[0].x);
    this.players[1].y = this.terrainHeightAt(this.players[1].x);
    this.idleZoom = this.computeSafeIdleZoom();
    this.resetCamera();
  }

  // Zeigt die Distanz an einem Bildschirmrand an - auf der Seite, zu
  // der der Gegner tatsächlich steht - mit einem Pfeil als
  // Richtungsangabe, statt den Gegner direkt zu zeigen. Berechnet die
  // tatsächliche, aktuelle Entfernung aus den Live-Positionen (nicht
  // den ursprünglich ausgewürfelten Arena-Wert), damit die Anzeige
  // nach dem Umherlaufen wirklich kleiner wird. Fliegt gerade ein
  // Pfeil, zählt die Anzeige stattdessen die noch verbleibende
  // Reststrecke bis zum Ziel herunter - sie schrumpft dann sichtbar
  // im Takt des Pfeilflugs, statt konstant zu bleiben.
  updateDistanceUI() {
    if (!this.players.length) return;
    const shooter = this.activePlayer;
    const opponent = this.players.find((p) => p !== shooter);
    const activeProjectile = this.projectiles[0];
    const referenceX = activeProjectile ? activeProjectile.x : shooter.x;
    const liveDistance = Math.abs(opponent.x - referenceX);
    const opponentIsRight = opponent.x > referenceX;

    distanceIndicator.classList.toggle("side-right", opponentIsRight);
    distanceIndicator.classList.toggle("side-left", !opponentIsRight);
    distanceIndicator.querySelector(".arrow").textContent = opponentIsRight ? "→" : "←";
    distanceIndicator.querySelector(".value").textContent = `${Math.round(liveDistance / 10)}m`;
  }

  // ---------------------------------------------------------------
  // Kamera: zeigt in Ruhe nur den aktiven Spieler (der Gegner ist in
  // der großen Arena normalerweise außer Sicht), zoomt beim Abschuss
  // heraus, damit man das Gelände im Pfeilflug überblicken kann, und
  // kehrt danach zur nahen Sicht auf den nächsten Spieler zurück.
  // ---------------------------------------------------------------
  computeSafeIdleZoom() {
    // Zoomt so weit ein, dass der Gegner (der "distance" entfernt
    // steht) garantiert außerhalb des sichtbaren Bereichs bleibt,
    // egal wie breit der Bildschirm oder wie klein der Abstand ist.
    const distance = this.distance ?? MIN_DISTANCE;
    const desiredHalfView = distance * 0.42;
    return Math.max(1, width / 2 / desiredHalfView);
  }

  resetCamera() {
    if (!width) return;
    const shooter = this.players[this.turn];
    this.camera = {
      x: shooter.x,
      y: groundY - height * 0.18,
      zoom: this.idleZoom,
    };
  }

  updateCamera(dt) {
    const cam = this.camera;
    const activeProjectile = this.projectiles[0];

    let targetX;
    let targetY;
    let targetZoom;

    if (activeProjectile) {
      const margin = width * 0.15;
      targetX = Math.min(Math.max(activeProjectile.x, margin), WORLD_WIDTH - margin);
      targetY = Math.min(Math.max(activeProjectile.y, height * 0.15), groundY);
      // Im Flug zoomt die Kamera heraus (deutlich weiter als die enge
      // Zielsicht), damit man das Gelände zwischen den Spielern
      // überblicken kann, statt nur den Pfeil aus der Nähe zu sehen.
      targetZoom = FLIGHT_ZOOM;
    } else {
      const shooter = this.activePlayer;
      targetX = shooter.x;
      targetY = groundY - height * 0.18;
      targetZoom = this.idleZoom;
    }

    const followSpeed = 4.5; // je höher, desto schneller reagiert die Kamera
    const t = 1 - Math.exp(-followSpeed * dt);
    cam.x += (targetX - cam.x) * t;
    cam.y += (targetY - cam.y) * t;
    cam.zoom += (targetZoom - cam.zoom) * t;

    if (this.shake > 0) {
      this.shake = Math.max(0, this.shake - dt * 3);
    }
  }

  spawnHitText(x, y, text, color) {
    this.hitTexts.push({ x, y, text, color, life: 1 });
  }

  triggerImpactShake() {
    this.shake = 1;
  }

  get activePlayer() {
    return this.players[this.turn];
  }

  updateHud() {
    const [p1, p2] = this.players;
    hpFillP1.style.width = `${(p1.health / p1.character.maxHealth) * 100}%`;
    hpFillP2.style.width = `${(p2.health / p2.character.maxHealth) * 100}%`;
    hpFillP1.classList.toggle("low", p1.health / p1.character.maxHealth < 0.3);
    hpFillP2.classList.toggle("low", p2.health / p2.character.maxHealth < 0.3);

    hudP1.classList.toggle("active", !this.gameOver && this.activePlayer === p1);
    hudP2.classList.toggle("active", !this.gameOver && this.activePlayer === p2);

    if (!this.gameOver) {
      turnIndicator.textContent = `${this.activePlayer === p1 ? "Spieler 1" : "Spieler 2"} ist am Zug`;
    }
    this.updateDistanceUI();
  }

  startDrag(pos) {
    if (this.gameOver || this.projectiles.length > 0) return;
    this.isDragging = true;
    this.dragStart = pos;
    this.dragCurrent = pos;
  }

  // ---------------------------------------------------------------
  // Bewegung: der Joystick steht die ganze Runde über bereit und
  // blockiert nie das Zielen/Schießen - beides geht jederzeit parallel.
  // Statt einer Zeitsperre gibt es ein Ausdauer-Budget: es sinkt nur,
  // während man tatsächlich läuft, und begrenzt so die Gesamtstrecke
  // pro Zug auf ca. 20m. Ist es leer, bleibt man einfach stehen -
  // keine Blockade, kein Timer, kein Skip nötig.
  // ---------------------------------------------------------------
  showMovementControls() {
    this.stamina = STAMINA_RANGE;
    this.moveDir = 0;
    moveControls.classList.remove("hidden");
    staminaFill.style.width = "100%";
    joystickKnob.style.transform = "translate(0px, 0px)";
    joystickBase.classList.remove("active");
  }

  hideMovementControls() {
    this.moveDir = 0;
    moveControls.classList.add("hidden");
    joystickKnob.style.transform = "translate(0px, 0px)";
    joystickBase.classList.remove("active");
  }

  // dir ist analog im Bereich -1..1 (Joystick-Auslenkung), bestimmt
  // Richtung UND Lauftempo zugleich. Eine kleine Totzone verhindert
  // winziges Zittern.
  setMoveDirection(dir) {
    if (this.gameOver || this.projectiles.length > 0) {
      this.moveDir = 0;
      return;
    }
    const DEADZONE = 0.15;
    this.moveDir = Math.abs(dir) < DEADZONE ? 0 : dir;
  }

  updateMovement(dt) {
    if (!this.moveDir || this.stamina <= 0) return;

    const shooter = this.activePlayer;
    const opponent = this.players.find((p) => p !== shooter);

    let minX = WORLD_MARGIN;
    let maxX = WORLD_WIDTH - WORLD_MARGIN;
    if (opponent.x > shooter.x) {
      maxX = Math.min(maxX, opponent.x - MOVE_MIN_GAP);
    } else {
      minX = Math.max(minX, opponent.x + MOVE_MIN_GAP);
    }

    const wanted = Math.abs(this.moveDir) * MOVE_SPEED * dt;
    const spend = Math.min(wanted, this.stamina);
    const dx = Math.sign(this.moveDir) * spend;

    const newX = Math.min(Math.max(shooter.x + dx, minX), maxX);
    const actualSpend = Math.abs(newX - shooter.x);

    shooter.x = newX;
    shooter.y = this.terrainHeightAt(shooter.x);
    this.stamina = Math.max(0, this.stamina - actualSpend);
    staminaFill.style.width = `${(this.stamina / STAMINA_RANGE) * 100}%`;
    this.updateDistanceUI();
  }

  // Berechnet aus dem aktuellen Drag Distanz + Winkel - vollkommen
  // frei, keine künstliche Winkel-Sperre. Wird von der Zughilfe-
  // Vorschau, der Ziellinie und dem tatsächlichen Schuss gemeinsam
  // genutzt, damit alle drei exakt übereinstimmen.
  getDragShot() {
    const dx = this.dragStart.x - this.dragCurrent.x;
    const dy = this.dragStart.y - this.dragCurrent.y;
    const dist = Math.min(Math.hypot(dx, dy), MAX_DRAG);
    const angle = Math.atan2(dy, dx);
    return { dist, angle };
  }

  updateDrag(pos) {
    if (!this.isDragging) return;
    this.dragCurrent = pos;
    this.activePlayer.aimAngle = this.getDragShot().angle;
  }

  endDrag() {
    if (!this.isDragging) return;
    this.isDragging = false;

    const { dist, angle } = this.getDragShot();
    if (dist < 12) return; // zu klein, als Tap ignorieren

    this.hasFiredOnce = true;
    aimHint.classList.add("hidden");
    this.hideMovementControls();

    const power = dist * POWER_TO_SPEED;
    const ability = this.activePlayer.character.ability;

    const shooter = this.activePlayer;
    this.projectiles.push(
      new Projectile({
        x: shooter.x + Math.cos(angle) * 40,
        y: shooter.y - 35 + Math.sin(angle) * 40,
        vx: Math.cos(angle) * power * ability.speedMultiplier,
        vy: Math.sin(angle) * power * ability.speedMultiplier,
        damage: ability.damage,
        color: ability.projectileColor,
        ownerId: shooter.id,
      })
    );
  }

  update(dt) {
    this.projectiles.forEach((p) => p.update(dt));
    this.updateCamera(dt);
    this.updateMovement(dt);
    if (this.projectiles.length > 0) this.updateDistanceUI();

    this.hitTexts.forEach((t) => {
      t.y -= 40 * dt;
      t.life -= dt * 1.2;
    });
    this.hitTexts = this.hitTexts.filter((t) => t.life > 0);

    for (const proj of this.projectiles) {
      if (proj.dead) continue;

      let hit = false;

      if (proj.y > height + 100 || proj.x < -100 || proj.x > WORLD_WIDTH + 100) {
        proj.dead = true;
      } else {
        for (const target of this.players) {
          if (target.id === proj.ownerId || !target.isAlive) continue;

          const ability = this.activePlayer.character.ability;
          const headDx = proj.x - target.x;
          const headDy = proj.y - (target.y + HEAD_OFFSET_Y);
          const bodyDx = proj.x - target.x;
          const bodyDy = proj.y - (target.y + BODY_OFFSET_Y);

          if (Math.hypot(headDx, headDy) < HEAD_RADIUS) {
            target.takeDamage(ability.headshotDamage);
            this.spawnHitText(target.x, target.y + HEAD_OFFSET_Y, "HEADSHOT!", "#ff5252");
            proj.dead = true;
            hit = true;
            this.triggerImpactShake();
            this.onHit(target);
            break;
          }

          if (Math.hypot(bodyDx, bodyDy) < BODY_RADIUS) {
            target.takeDamage(ability.damage);
            this.spawnHitText(target.x, target.y + BODY_OFFSET_Y, `-${ability.damage}`, "#ffd54f");
            proj.dead = true;
            hit = true;
            this.triggerImpactShake();
            this.onHit(target);
            break;
          }
        }

        if (!proj.dead && proj.y >= this.terrainHeightAt(proj.x)) {
          proj.dead = true;
        }
      }

      if (proj.dead && !hit) {
        // Pfeil hat nicht getroffen (Boden/Rand) - Zug geht trotzdem weiter
        this.nextTurn();
      }
    }

    this.projectiles = this.projectiles.filter((p) => !p.dead);
  }

  onHit(target) {
    this.updateHud();
    if (!target.isAlive) {
      this.endGame(this.activePlayer);
      return;
    }
    this.nextTurn();
  }

  nextTurn() {
    this.turn = (this.turn + 1) % 2;
    this.updateHud();
    this.showMovementControls();
  }

  endGame(winner) {
    this.gameOver = true;
    this.hideMovementControls();
    const label = winner === this.players[0] ? "Spieler 1" : "Spieler 2";
    winnerText.textContent = `${label} gewinnt!`;
    winnerScreen.classList.remove("hidden");
  }

  drawTree(ctx, tree) {
    const groundYAt = this.terrainHeightAt(tree.x);
    const s = tree.scale;
    const trunkH = 30 * s;
    const trunkW = 7 * s;

    ctx.save();
    ctx.translate(tree.x, groundYAt);

    ctx.fillStyle = "#2b1d14";
    ctx.fillRect(-trunkW / 2, -trunkH, trunkW, trunkH);

    const green = `hsl(${125 + tree.tone * 20}, 32%, ${22 + tree.tone * 8}%)`;
    ctx.fillStyle = green;
    for (let i = 0; i < 3; i++) {
      const r = (30 - i * 6) * s;
      const yy = -trunkH - i * 16 * s;
      ctx.beginPath();
      ctx.arc(0, yy, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  draw() {
    ctx.clearRect(0, 0, width, height);

    // Himmel (bildschirmfest, nicht Teil der Kamerawelt)
    const sky = ctx.createLinearGradient(0, 0, 0, height);
    sky.addColorStop(0, "#1e2a4a");
    sky.addColorStop(1, "#4a3a5a");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, width, height);

    // Kamera-Transform: alles ab hier ist Weltraum und bewegt/zoomt
    // sich mit dem Pfeilflug mit.
    ctx.save();
    const cam = this.camera;
    let shakeX = 0;
    let shakeY = 0;
    if (this.shake > 0) {
      shakeX = (Math.random() - 0.5) * 10 * this.shake;
      shakeY = (Math.random() - 0.5) * 10 * this.shake;
    }
    ctx.translate(width / 2 + shakeX, height / 2 + shakeY);
    ctx.scale(cam.zoom, cam.zoom);
    ctx.translate(-cam.x, -cam.y);

    // Boden folgt jetzt dem Hügelprofil statt flach zu sein (deckt
    // die gesamte Arena ab, damit Kameraschwenks nie den Rand zeigen)
    const groundPad = WORLD_MARGIN;
    const terrainStep = 50;
    const groundBottom = groundY + 400;

    ctx.beginPath();
    ctx.moveTo(-groundPad, groundBottom);
    for (let tx = -groundPad; tx <= WORLD_WIDTH + groundPad; tx += terrainStep) {
      ctx.lineTo(tx, this.terrainHeightAt(tx));
    }
    ctx.lineTo(WORLD_WIDTH + groundPad, this.terrainHeightAt(WORLD_WIDTH + groundPad));
    ctx.lineTo(WORLD_WIDTH + groundPad, groundBottom);
    ctx.closePath();
    ctx.fillStyle = "#3e2723";
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(-groundPad, this.terrainHeightAt(-groundPad));
    for (let tx = -groundPad; tx <= WORLD_WIDTH + groundPad; tx += terrainStep) {
      ctx.lineTo(tx, this.terrainHeightAt(tx));
    }
    ctx.strokeStyle = "#5d4037";
    ctx.lineWidth = 8;
    ctx.lineJoin = "round";
    ctx.stroke();
    ctx.strokeStyle = "#6d8c4a";
    ctx.lineWidth = 3;
    ctx.stroke();

    // Bäume im Hintergrund, auf dem Gelände stehend - rein
    // dekorativ, macht die Arena lebendiger.
    this.trees.forEach((tree) => this.drawTree(ctx, tree));

    this.players.forEach((p) => p.draw(ctx));
    this.projectiles.forEach((p) => p.draw(ctx));

    this.hitTexts.forEach((t) => {
      ctx.save();
      ctx.globalAlpha = Math.max(0, t.life);
      ctx.fillStyle = t.color;
      ctx.font = "bold 22px 'Segoe UI', Arial, sans-serif";
      ctx.textAlign = "center";
      ctx.strokeStyle = "rgba(0,0,0,0.6)";
      ctx.lineWidth = 3;
      ctx.strokeText(t.text, t.x, t.y);
      ctx.fillText(t.text, t.x, t.y);
      ctx.restore();
    });

    ctx.restore();

    // Zielhilfe & Kraftanzeige werden bewusst in Bildschirmkoordinaten
    // (außerhalb der Kamera-Transformation) gezeichnet, damit sie 1:1
    // der Mausbewegung folgen, unabhängig vom aktuellen Kamera-Zoom.
    if (this.isDragging) {
      const shooter = this.activePlayer;
      const shooterScreenX = width / 2 + (shooter.x - cam.x) * cam.zoom;
      const shooterScreenY = height / 2 + (shooter.y - 35 - cam.y) * cam.zoom;
      const { dist, angle } = this.getDragShot();

      ctx.save();
      ctx.strokeStyle = "#ffd54f";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(shooterScreenX, shooterScreenY);
      ctx.lineTo(
        shooterScreenX + Math.cos(angle) * dist,
        shooterScreenY + Math.sin(angle) * dist
      );
      ctx.stroke();

      // Kraftanzeige - Farbe wandert grün -> gelb -> rot mit der Stärke
      const powerRatio = dist / MAX_DRAG;
      const meterW = 64;
      const meterH = 12;
      const meterX = shooterScreenX - meterW / 2;
      const meterY = shooterScreenY - 90;

      ctx.fillStyle = "rgba(0,0,0,0.35)";
      ctx.beginPath();
      ctx.roundRect(meterX - 2, meterY - 2, meterW + 4, meterH + 4, 7);
      ctx.fill();

      ctx.fillStyle = "rgba(255,255,255,0.12)";
      ctx.beginPath();
      ctx.roundRect(meterX, meterY, meterW, meterH, 5);
      ctx.fill();

      const hue = 130 - powerRatio * 130; // 130=grün -> 0=rot
      ctx.fillStyle = `hsl(${hue}, 85%, 55%)`;
      ctx.beginPath();
      ctx.roundRect(meterX, meterY, meterW * powerRatio, meterH, 5);
      ctx.fill();
      ctx.restore();
    }
  }
}

let game;

function loop(timestamp) {
  if (!loop.last) loop.last = timestamp;
  const dt = Math.min((timestamp - loop.last) / 1000, 0.033);
  loop.last = timestamp;

  game.update(dt);
  game.draw();

  requestAnimationFrame(loop);
}

function getPos(evt) {
  const rect = canvas.getBoundingClientRect();
  const point = evt.touches ? evt.touches[0] : evt;
  return { x: point.clientX - rect.left, y: point.clientY - rect.top };
}

function attachInput() {
  canvas.addEventListener("mousedown", (e) => game.startDrag(getPos(e)));
  canvas.addEventListener("mousemove", (e) => game.updateDrag(getPos(e)));
  window.addEventListener("mouseup", () => game.endDrag());

  canvas.addEventListener(
    "touchstart",
    (e) => {
      e.preventDefault();
      game.startDrag(getPos(e));
    },
    { passive: false }
  );
  canvas.addEventListener(
    "touchmove",
    (e) => {
      e.preventDefault();
      game.updateDrag(getPos(e));
    },
    { passive: false }
  );
  window.addEventListener("touchend", () => game.endDrag());

  restartBtn.addEventListener("click", () => game.reset());

  // Joystick: ziehen setzt Richtung UND Tempo analog (Auslenkung vom
  // Mittelpunkt, horizontal geklemmt auf den Basis-Radius). Die
  // 5-Sekunden-Uhr startet erst bei der ersten echten Auslenkung.
  const JOYSTICK_RADIUS = 34;
  let joystickPointerId = null;

  const setKnobOffset = (dx, dy) => {
    joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
  };

  const handleJoystickPointer = (e) => {
    const rect = joystickBase.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    let dx = e.clientX - cx;
    let dy = e.clientY - cy;
    const dist = Math.hypot(dx, dy);
    if (dist > JOYSTICK_RADIUS) {
      dx = (dx / dist) * JOYSTICK_RADIUS;
      dy = (dy / dist) * JOYSTICK_RADIUS;
    }
    setKnobOffset(dx, dy);
    game.setMoveDirection(dx / JOYSTICK_RADIUS);
  };

  const releaseJoystick = () => {
    joystickPointerId = null;
    joystickBase.classList.remove("active");
    setKnobOffset(0, 0);
    game.setMoveDirection(0);
  };

  joystickBase.addEventListener("pointerdown", (e) => {
    if (game.gameOver || game.projectiles.length > 0) return;
    joystickPointerId = e.pointerId;
    joystickBase.setPointerCapture(e.pointerId);
    joystickBase.classList.add("active");
    handleJoystickPointer(e);
  });
  joystickBase.addEventListener("pointermove", (e) => {
    if (e.pointerId !== joystickPointerId) return;
    handleJoystickPointer(e);
  });
  joystickBase.addEventListener("pointerup", (e) => {
    if (e.pointerId !== joystickPointerId) return;
    releaseJoystick();
  });
  joystickBase.addEventListener("pointercancel", (e) => {
    if (e.pointerId !== joystickPointerId) return;
    releaseJoystick();
  });
}

resize();
game = new Game();
attachInput();
requestAnimationFrame(loop);
</script>
</body>
</html>
