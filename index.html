<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bowmasters Clone</title>
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1a1a2e;
    font-family: "Segoe UI", Arial, sans-serif;
    user-select: none;
  }

  #game-canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
    cursor: crosshair;
  }

  #ui-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }

  .hud {
    position: absolute;
    top: 20px;
    width: 220px;
    padding: 8px 12px;
    background: rgba(0, 0, 0, 0.45);
    border-radius: 10px;
    color: #fff;
  }

  #hud-p1 {
    left: 20px;
  }

  #hud-p2 {
    right: 20px;
    text-align: right;
  }

  .name {
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 4px;
  }

  .healthbar {
    width: 100%;
    height: 14px;
    background: #333;
    border-radius: 7px;
    overflow: hidden;
    border: 2px solid #000;
  }

  .healthbar-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #4caf50, #8bc34a);
    transition: width 0.3s ease;
  }

  .healthbar-fill.low {
    background: linear-gradient(90deg, #e53935, #ff7043);
  }

  #turn-indicator {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 8px 20px;
    background: rgba(0, 0, 0, 0.45);
    border-radius: 10px;
    color: #ffd54f;
    font-weight: bold;
  }

  #distance-indicator {
    position: absolute;
    top: 62px;
    left: 50%;
    transform: translateX(-50%);
    padding: 4px 16px;
    background: rgba(0, 0, 0, 0.35);
    border-radius: 8px;
    color: #cfd8dc;
    font-size: 13px;
  }

  #winner-screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    background: rgba(0, 0, 0, 0.7);
    pointer-events: all;
  }

  #winner-screen.hidden {
    display: none;
  }

  #winner-text {
    font-size: 42px;
    color: #ffd54f;
    font-weight: bold;
    text-shadow: 2px 2px 6px #000;
  }

  #restart-btn {
    padding: 12px 28px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    background: #ffd54f;
    cursor: pointer;
    font-weight: bold;
  }

  #restart-btn:hover {
    background: #ffca28;
  }
</style>
</head>
<body>
  <div id="ui-overlay">
    <div class="hud" id="hud-p1">
      <div class="name" id="name-p1">Spieler 1</div>
      <div class="healthbar"><div class="healthbar-fill" id="hp-p1"></div></div>
    </div>
    <div class="hud" id="hud-p2">
      <div class="name" id="name-p2">Spieler 2</div>
      <div class="healthbar"><div class="healthbar-fill" id="hp-p2"></div></div>
    </div>
    <div id="turn-indicator">Spieler 1 ist am Zug</div>
    <div id="distance-indicator">Entfernung: 0m</div>
    <div id="winner-screen" class="hidden">
      <div id="winner-text"></div>
      <button id="restart-btn">Nochmal spielen</button>
    </div>
  </div>
  <canvas id="game-canvas"></canvas>

<script>
// ---------------------------------------------------------------------
// Charakter-Definitionen. Neue Charaktere kommen einfach als weiterer
// Eintrag hier rein - Farbe, Basiswerte, Fähigkeit. Die Spiellogik
// darunter muss dafür nicht angefasst werden.
// ---------------------------------------------------------------------
const Characters = {
  main: {
    id: "main",
    name: "Bowman",
    color: "#8d6e63",
    bowColor: "#5d4037",
    maxHealth: 100,
    ability: {
      id: "power_shot",
      name: "Power Shot",
      description: "Ein normaler, kräftiger Pfeil.",
      damage: 20, // Körpertreffer
      headshotDamage: 40, // Kopftreffer - doppelter Schaden
      projectileColor: "#f5f5f5",
      speedMultiplier: 1,
    },
  },
};

function getCharacter(id) {
  return Characters[id] ?? Characters.main;
}

// ---------------------------------------------------------------------
// Trefferzonen (relativ zur Spielerposition) - von Zeichnen und
// Kollisionserkennung gemeinsam genutzt, damit Hitbox und Grafik
// immer übereinstimmen.
// ---------------------------------------------------------------------
const HEAD_OFFSET_Y = -68;
const HEAD_RADIUS = 20;
const BODY_OFFSET_Y = -30;
const BODY_RADIUS = 34;

// ---------------------------------------------------------------------
// Spieler
// ---------------------------------------------------------------------
class Player {
  constructor({ id, characterId, x, y, facing }) {
    this.id = id;
    this.character = getCharacter(characterId);
    this.x = x;
    this.y = y;
    this.facing = facing; // 1 = schaut nach rechts, -1 = nach links
    this.health = this.character.maxHealth;
    this.aimAngle = facing === 1 ? -0.3 : Math.PI + 0.3;
  }

  get isAlive() {
    return this.health > 0;
  }

  takeDamage(amount) {
    this.health = Math.max(0, this.health - amount);
  }

  draw(ctx) {
    const { x, y } = this;
    const flip = this.facing;

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(flip, 1);

    // Beine
    ctx.strokeStyle = "#3e2723";
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(-10, 0);
    ctx.lineTo(-14, 40);
    ctx.moveTo(10, 0);
    ctx.lineTo(14, 40);
    ctx.stroke();

    // Körper
    ctx.fillStyle = this.character.color;
    ctx.beginPath();
    ctx.ellipse(0, BODY_OFFSET_Y, 22, 32, 0, 0, Math.PI * 2);
    ctx.fill();

    // Kopf
    ctx.fillStyle = "#ffccbc";
    ctx.beginPath();
    ctx.arc(0, HEAD_OFFSET_Y, 16, 0, Math.PI * 2);
    ctx.fill();

    // Bogen
    ctx.strokeStyle = this.character.bowColor;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(26, -35, 22, -1.1, 1.1);
    ctx.stroke();

    ctx.restore();

    // Ziellinie
    if (this.isAlive) {
      ctx.save();
      ctx.strokeStyle = "rgba(255,255,255,0.5)";
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(x, y - 35);
      ctx.lineTo(
        x + Math.cos(this.aimAngle) * 60,
        y - 35 + Math.sin(this.aimAngle) * 60
      );
      ctx.stroke();
      ctx.restore();
    }
  }
}

// ---------------------------------------------------------------------
// Projektil
// ---------------------------------------------------------------------
const GRAVITY = 900; // px/s^2

class Projectile {
  constructor({ x, y, vx, vy, damage, color, ownerId }) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.damage = damage;
    this.color = color;
    this.ownerId = ownerId;
    this.dead = false;
    this.trail = [];
  }

  update(dt) {
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > 12) this.trail.shift();

    this.vy += GRAVITY * dt;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
  }

  get angle() {
    return Math.atan2(this.vy, this.vx);
  }

  draw(ctx) {
    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,0.25)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    this.trail.forEach((p, i) => {
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    });
    ctx.stroke();

    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.moveTo(14, 0);
    ctx.lineTo(-10, -4);
    ctx.lineTo(-10, 4);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

// ---------------------------------------------------------------------
// Spiel
// ---------------------------------------------------------------------
const canvas = document.getElementById("game-canvas");
const ctx = canvas.getContext("2d");

const hpFillP1 = document.getElementById("hp-p1");
const hpFillP2 = document.getElementById("hp-p2");
const turnIndicator = document.getElementById("turn-indicator");
const distanceIndicator = document.getElementById("distance-indicator");
const winnerScreen = document.getElementById("winner-screen");
const winnerText = document.getElementById("winner-text");
const restartBtn = document.getElementById("restart-btn");

const MAX_DRAG = 170;
const POWER_TO_SPEED = 9;

// Die Arena ist viel breiter als der Bildschirm: die Spieler stehen an
// zufälligen, unterschiedlich weit auseinander liegenden Positionen,
// damit man nicht jedes Mal denselben Winkel/dieselbe Kraft schießen
// kann. groundY bleibt bildschirmbezogen (Boden ist immer unten).
const WORLD_MARGIN = 400;
const MIN_DISTANCE = 900;
const MAX_DISTANCE = 2200;
const WORLD_WIDTH = MAX_DISTANCE + WORLD_MARGIN * 2;

let width, height, groundY;

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  groundY = height - 90;
  if (game) game.layout();
}
window.addEventListener("resize", resize);

class Game {
  constructor() {
    this.reset();
  }

  reset() {
    this.players = [
      new Player({ id: "p1", characterId: "main", x: 0, y: 0, facing: 1 }),
      new Player({ id: "p2", characterId: "main", x: 0, y: 0, facing: -1 }),
    ];
    this.turn = 0; // Index in players
    this.projectiles = [];
    this.hitTexts = [];
    this.isDragging = false;
    this.dragStart = null;
    this.dragCurrent = null;
    this.gameOver = false;
    this.shake = 0;
    winnerScreen.classList.add("hidden");
    this.updateHud();
    this.randomizeArena();
  }

  // Neue Runde: zufälliger Abstand zwischen den Spielern, an
  // zufälliger Stelle in der (viel breiteren) Arena platziert.
  randomizeArena() {
    if (!width) return;
    const distance = MIN_DISTANCE + Math.random() * (MAX_DISTANCE - MIN_DISTANCE);
    const usableWidth = WORLD_WIDTH - WORLD_MARGIN * 2 - distance;
    const p1X = WORLD_MARGIN + Math.random() * Math.max(0, usableWidth);

    this.players[0].x = p1X;
    this.players[1].x = p1X + distance;
    this.distance = distance;
    this.updateDistanceUI();
    this.layout();
  }

  // Wird auch bei Fenstergröße-Änderungen aufgerufen - verändert nur
  // bildschirmabhängige Werte, nie die Arena-Zufallswerte selbst.
  layout() {
    if (!width) return;
    this.players[0].y = groundY;
    this.players[1].y = groundY;
    this.idleZoom = this.computeSafeIdleZoom();
    this.resetCamera();
  }

  updateDistanceUI() {
    if (this.distance == null) return;
    distanceIndicator.textContent = `Entfernung: ${Math.round(this.distance / 10)}m`;
  }

  // ---------------------------------------------------------------
  // Kamera: zeigt in Ruhe nur den aktiven Spieler (der Gegner ist in
  // der großen Arena normalerweise außer Sicht), folgt dem Pfeil im
  // Flug quer durch die Welt und zoomt dabei etwas rein.
  // ---------------------------------------------------------------
  computeSafeIdleZoom() {
    // Zoomt so weit ein, dass der Gegner (der "distance" entfernt
    // steht) garantiert außerhalb des sichtbaren Bereichs bleibt,
    // egal wie breit der Bildschirm oder wie klein der Abstand ist.
    const distance = this.distance ?? MIN_DISTANCE;
    const desiredHalfView = distance * 0.42;
    return Math.max(1, width / 2 / desiredHalfView);
  }

  resetCamera() {
    if (!width) return;
    const shooter = this.players[this.turn];
    this.camera = {
      x: shooter.x,
      y: groundY - height * 0.18,
      zoom: this.idleZoom,
    };
  }

  updateCamera(dt) {
    const cam = this.camera;
    const activeProjectile = this.projectiles[0];

    let targetX;
    let targetY;
    let targetZoom;

    if (activeProjectile) {
      const margin = width * 0.15;
      targetX = Math.min(Math.max(activeProjectile.x, margin), WORLD_WIDTH - margin);
      targetY = Math.min(Math.max(activeProjectile.y, height * 0.15), groundY);
      targetZoom = 1.35;
    } else {
      const shooter = this.activePlayer;
      targetX = shooter.x;
      targetY = groundY - height * 0.18;
      targetZoom = this.idleZoom;
    }

    const followSpeed = 4.5; // je höher, desto schneller reagiert die Kamera
    const t = 1 - Math.exp(-followSpeed * dt);
    cam.x += (targetX - cam.x) * t;
    cam.y += (targetY - cam.y) * t;
    cam.zoom += (targetZoom - cam.zoom) * t;

    if (this.shake > 0) {
      this.shake = Math.max(0, this.shake - dt * 3);
    }
  }

  spawnHitText(x, y, text, color) {
    this.hitTexts.push({ x, y, text, color, life: 1 });
  }

  triggerImpactShake() {
    this.shake = 1;
  }

  get activePlayer() {
    return this.players[this.turn];
  }

  updateHud() {
    const [p1, p2] = this.players;
    hpFillP1.style.width = `${(p1.health / p1.character.maxHealth) * 100}%`;
    hpFillP2.style.width = `${(p2.health / p2.character.maxHealth) * 100}%`;
    hpFillP1.classList.toggle("low", p1.health / p1.character.maxHealth < 0.3);
    hpFillP2.classList.toggle("low", p2.health / p2.character.maxHealth < 0.3);

    if (!this.gameOver) {
      turnIndicator.textContent = `${this.activePlayer === p1 ? "Spieler 1" : "Spieler 2"} ist am Zug`;
    }
  }

  startDrag(pos) {
    if (this.gameOver || this.projectiles.length > 0) return;
    this.isDragging = true;
    this.dragStart = pos;
    this.dragCurrent = pos;
  }

  updateDrag(pos) {
    if (!this.isDragging) return;
    this.dragCurrent = pos;

    const dx = this.dragStart.x - pos.x;
    const dy = this.dragStart.y - pos.y;
    const angle = Math.atan2(dy, dx);
    this.activePlayer.aimAngle = angle;
  }

  endDrag() {
    if (!this.isDragging) return;
    this.isDragging = false;

    const dx = this.dragStart.x - this.dragCurrent.x;
    const dy = this.dragStart.y - this.dragCurrent.y;
    const dist = Math.min(Math.hypot(dx, dy), MAX_DRAG);
    if (dist < 12) return; // zu klein, als Tap ignorieren

    const angle = Math.atan2(dy, dx);
    const power = dist * POWER_TO_SPEED;
    const ability = this.activePlayer.character.ability;

    const shooter = this.activePlayer;
    this.projectiles.push(
      new Projectile({
        x: shooter.x + Math.cos(angle) * 40,
        y: shooter.y - 35 + Math.sin(angle) * 40,
        vx: Math.cos(angle) * power * ability.speedMultiplier,
        vy: Math.sin(angle) * power * ability.speedMultiplier,
        damage: ability.damage,
        color: ability.projectileColor,
        ownerId: shooter.id,
      })
    );
  }

  update(dt) {
    this.projectiles.forEach((p) => p.update(dt));
    this.updateCamera(dt);

    this.hitTexts.forEach((t) => {
      t.y -= 40 * dt;
      t.life -= dt * 1.2;
    });
    this.hitTexts = this.hitTexts.filter((t) => t.life > 0);

    for (const proj of this.projectiles) {
      if (proj.dead) continue;

      let hit = false;

      if (proj.y > height + 100 || proj.x < -100 || proj.x > WORLD_WIDTH + 100) {
        proj.dead = true;
      } else {
        for (const target of this.players) {
          if (target.id === proj.ownerId || !target.isAlive) continue;

          const ability = this.activePlayer.character.ability;
          const headDx = proj.x - target.x;
          const headDy = proj.y - (target.y + HEAD_OFFSET_Y);
          const bodyDx = proj.x - target.x;
          const bodyDy = proj.y - (target.y + BODY_OFFSET_Y);

          if (Math.hypot(headDx, headDy) < HEAD_RADIUS) {
            target.takeDamage(ability.headshotDamage);
            this.spawnHitText(target.x, target.y + HEAD_OFFSET_Y, "HEADSHOT!", "#ff5252");
            proj.dead = true;
            hit = true;
            this.triggerImpactShake();
            this.onHit(target);
            break;
          }

          if (Math.hypot(bodyDx, bodyDy) < BODY_RADIUS) {
            target.takeDamage(ability.damage);
            this.spawnHitText(target.x, target.y + BODY_OFFSET_Y, `-${ability.damage}`, "#ffd54f");
            proj.dead = true;
            hit = true;
            this.triggerImpactShake();
            this.onHit(target);
            break;
          }
        }

        if (!proj.dead && proj.y >= groundY) {
          proj.dead = true;
        }
      }

      if (proj.dead && !hit) {
        // Pfeil hat nicht getroffen (Boden/Rand) - Zug geht trotzdem weiter
        this.nextTurn();
      }
    }

    this.projectiles = this.projectiles.filter((p) => !p.dead);
  }

  onHit(target) {
    this.updateHud();
    if (!target.isAlive) {
      this.endGame(this.activePlayer);
      return;
    }
    this.nextTurn();
  }

  nextTurn() {
    this.turn = (this.turn + 1) % 2;
    this.updateHud();
  }

  endGame(winner) {
    this.gameOver = true;
    const label = winner === this.players[0] ? "Spieler 1" : "Spieler 2";
    winnerText.textContent = `${label} gewinnt!`;
    winnerScreen.classList.remove("hidden");
  }

  draw() {
    ctx.clearRect(0, 0, width, height);

    // Himmel (bildschirmfest, nicht Teil der Kamerawelt)
    const sky = ctx.createLinearGradient(0, 0, 0, height);
    sky.addColorStop(0, "#1e2a4a");
    sky.addColorStop(1, "#4a3a5a");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, width, height);

    // Kamera-Transform: alles ab hier ist Weltraum und bewegt/zoomt
    // sich mit dem Pfeilflug mit.
    ctx.save();
    const cam = this.camera;
    let shakeX = 0;
    let shakeY = 0;
    if (this.shake > 0) {
      shakeX = (Math.random() - 0.5) * 10 * this.shake;
      shakeY = (Math.random() - 0.5) * 10 * this.shake;
    }
    ctx.translate(width / 2 + shakeX, height / 2 + shakeY);
    ctx.scale(cam.zoom, cam.zoom);
    ctx.translate(-cam.x, -cam.y);

    // Boden (deckt die gesamte Arena ab, damit Kameraschwenks nie den
    // Rand zeigen)
    const groundPad = WORLD_MARGIN;
    ctx.fillStyle = "#3e2723";
    ctx.fillRect(-groundPad, groundY + 40, WORLD_WIDTH + groundPad * 2, height);
    ctx.fillStyle = "#5d4037";
    ctx.fillRect(-groundPad, groundY + 40, WORLD_WIDTH + groundPad * 2, 8);

    this.players.forEach((p) => p.draw(ctx));
    this.projectiles.forEach((p) => p.draw(ctx));

    this.hitTexts.forEach((t) => {
      ctx.save();
      ctx.globalAlpha = Math.max(0, t.life);
      ctx.fillStyle = t.color;
      ctx.font = "bold 22px 'Segoe UI', Arial, sans-serif";
      ctx.textAlign = "center";
      ctx.strokeStyle = "rgba(0,0,0,0.6)";
      ctx.lineWidth = 3;
      ctx.strokeText(t.text, t.x, t.y);
      ctx.fillText(t.text, t.x, t.y);
      ctx.restore();
    });

    ctx.restore();

    // Zielhilfe & Kraftanzeige werden bewusst in Bildschirmkoordinaten
    // (außerhalb der Kamera-Transformation) gezeichnet, damit sie 1:1
    // der Mausbewegung folgen, unabhängig vom aktuellen Kamera-Zoom.
    if (this.isDragging) {
      const shooter = this.activePlayer;
      const shooterScreenX = width / 2 + (shooter.x - cam.x) * cam.zoom;
      const shooterScreenY = height / 2 + (shooter.y - 35 - cam.y) * cam.zoom;
      const dx = this.dragStart.x - this.dragCurrent.x;
      const dy = this.dragStart.y - this.dragCurrent.y;
      const dist = Math.min(Math.hypot(dx, dy), MAX_DRAG);
      const angle = Math.atan2(dy, dx);

      ctx.save();
      ctx.strokeStyle = "#ffd54f";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(shooterScreenX, shooterScreenY);
      ctx.lineTo(
        shooterScreenX + Math.cos(angle) * dist,
        shooterScreenY + Math.sin(angle) * dist
      );
      ctx.stroke();

      // Kraftanzeige
      ctx.fillStyle = "rgba(255,255,255,0.15)";
      ctx.fillRect(shooterScreenX - 30, shooterScreenY - 85, 60, 12);
      ctx.fillStyle = "#ffd54f";
      ctx.fillRect(shooterScreenX - 30, shooterScreenY - 85, 60 * (dist / MAX_DRAG), 12);
      ctx.restore();
    }
  }
}

let game;

function loop(timestamp) {
  if (!loop.last) loop.last = timestamp;
  const dt = Math.min((timestamp - loop.last) / 1000, 0.033);
  loop.last = timestamp;

  game.update(dt);
  game.draw();

  requestAnimationFrame(loop);
}

function getPos(evt) {
  const rect = canvas.getBoundingClientRect();
  const point = evt.touches ? evt.touches[0] : evt;
  return { x: point.clientX - rect.left, y: point.clientY - rect.top };
}

function attachInput() {
  canvas.addEventListener("mousedown", (e) => game.startDrag(getPos(e)));
  canvas.addEventListener("mousemove", (e) => game.updateDrag(getPos(e)));
  window.addEventListener("mouseup", () => game.endDrag());

  canvas.addEventListener(
    "touchstart",
    (e) => {
      e.preventDefault();
      game.startDrag(getPos(e));
    },
    { passive: false }
  );
  canvas.addEventListener(
    "touchmove",
    (e) => {
      e.preventDefault();
      game.updateDrag(getPos(e));
    },
    { passive: false }
  );
  window.addEventListener("touchend", () => game.endDrag());

  restartBtn.addEventListener("click", () => game.reset());
}

resize();
game = new Game();
attachInput();
requestAnimationFrame(loop);
</script>
</body>
</html>
